<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563eb" />
  <circle cx="256" cy="256" r="220" fill="#ffffff" />
  
  <!-- Calendar outline -->
  <rect x="128" y="128" width="256" height="256" rx="16" fill="#2563eb" />
  
  <!-- Calendar header -->
  <rect x="128" y="128" width="256" height="48" rx="16" fill="#1e40af" />
  
  <!-- Calendar grid -->
  <g stroke="#ffffff" stroke-width="4">
    <!-- Horizontal lines -->
    <line x1="128" y1="176" x2="384" y2="176" />
    <line x1="128" y1="208" x2="384" y2="208" />
    <line x1="128" y1="240" x2="384" y2="240" />
    <line x1="128" y1="272" x2="384" y2="272" />
    <line x1="128" y1="304" x2="384" y2="304" />
    <line x1="128" y1="336" x2="384" y2="336" />
    
    <!-- Vertical lines -->
    <line x1="170" y1="176" x2="170" y2="384" />
    <line x1="213" y1="176" x2="213" y2="384" />
    <line x1="256" y1="176" x2="256" y2="384" />
    <line x1="299" y1="176" x2="299" y2="384" />
    <line x1="342" y1="176" x2="342" y2="384" />
  </g>
  
  <!-- Candlestick chart representing trading -->
  <g stroke-width="6" stroke-linecap="round">
    <!-- Candles -->
    <line x1="192" y1="220" x2="192" y2="290" stroke="#22c55e" />
    <rect x="184" y="240" width="16" height="30" fill="#22c55e" />
    
    <line x1="235" y1="236" x2="235" y2="316" stroke="#ef4444" />
    <rect x="227" y="236" width="16" height="35" fill="#ef4444" />
    
    <line x1="278" y1="200" x2="278" y2="280" stroke="#22c55e" />
    <rect x="270" y="220" width="16" height="40" fill="#22c55e" />
    
    <line x1="321" y1="230" x2="321" y2="330" stroke="#ef4444" />
    <rect x="313" y="260" width="16" height="50" fill="#ef4444" />
  </g>
  
  <!-- Graph trending up from bottom left to top right -->
  <path d="M142,350 Q200,320 230,290 T320,230" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" />
</svg>